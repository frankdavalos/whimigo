<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Whimigo</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      /* Page-level touch hygiene: no zoom, scrolling, selection, callout or pull-to-refresh. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #9ad8f5;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #arcade {
        position: fixed;
        inset: 0;
      }
      #arcade canvas {
        display: block;
      }

      /* The fatal error screen (ADR-0005): a picture and one large button that reloads. */
      #error-screen {
        position: fixed;
        inset: 0;
        /* Above the status page, should an error happen while it shows. */
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6vmin;
        background: #fff6e0;
      }
      #error-screen[hidden] {
        display: none;
      }
      #error-screen > svg {
        width: 36vmin;
        height: 36vmin;
      }
      #error-screen button {
        width: 32vmin;
        height: 32vmin;
        border: 1.5vmin solid #2f3a56;
        border-radius: 50%;
        background: #ffc94a;
        padding: 0;
        cursor: pointer;
        touch-action: manipulation;
      }
      #error-screen button svg {
        width: 60%;
        height: 60%;
      }

      /* The status page, the seed of the Grown-Ups Area (ADR-0005): real text, for adults only. */
      #grown-ups {
        position: fixed;
        inset: 0;
        z-index: 1;
        box-sizing: border-box;
        overflow: auto;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: #fff6e0;
        color: #2f3a56;
        font:
          20px/1.5 system-ui,
          sans-serif;
      }
      #grown-ups[hidden] {
        display: none;
      }
      #grown-ups h1 {
        margin: 0 0 16px;
        font-size: 32px;
      }
      #grown-ups dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 8px 24px;
        margin: 0 0 32px;
      }
      #grown-ups dt {
        font-weight: bold;
      }
      #grown-ups dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      #grown-ups button {
        min-width: 160px;
        min-height: 64px;
        border: 3px solid #2f3a56;
        border-radius: 16px;
        background: #ffc94a;
        color: inherit;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="arcade"></div>
    <div id="error-screen" hidden>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="#9ad8f5" stroke="#2f3a56" stroke-width="5" />
        <circle cx="35" cy="42" r="6" fill="#2f3a56" />
        <circle cx="65" cy="42" r="6" fill="#2f3a56" />
        <ellipse cx="50" cy="68" rx="9" ry="7" fill="#2f3a56" />
      </svg>
      <button type="button" aria-label="Start again">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path
            d="M78 50a28 28 0 1 1-8.2-19.8"
            fill="none"
            stroke="#2f3a56"
            stroke-width="11"
            stroke-linecap="round"
          />
          <path d="M84 14v26H58z" fill="#2f3a56" />
        </svg>
      </button>
    </div>
    <section id="grown-ups" hidden aria-labelledby="grown-ups-title">
      <h1 id="grown-ups-title">For grown-ups</h1>
      <dl>
        <dt>Version</dt>
        <dd data-reading="build"></dd>
        <dt>Offline</dt>
        <dd data-reading="offline"></dd>
        <dt>Updates</dt>
        <dd data-reading="update"></dd>
        <dt>Running as</dt>
        <dd data-reading="running-as"></dd>
        <dt>Safe-area insets</dt>
        <dd data-reading="insets"></dd>
      </dl>
      <button type="button">Back</button>
    </section>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
