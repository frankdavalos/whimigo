<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Whimigo</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      /* Page-level touch hygiene: no zoom, scrolling, selection, callout or pull-to-refresh. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #9ad8f5;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #arcade {
        position: fixed;
        inset: 0;
      }
      #arcade canvas {
        display: block;
      }

      /* The fatal error screen (ADR-0005): a picture and one large button that reloads. */
      #error-screen {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6vmin;
        background: #fff6e0;
      }
      #error-screen[hidden] {
        display: none;
      }
      #error-screen > svg {
        width: 36vmin;
        height: 36vmin;
      }
      #error-screen button {
        width: 32vmin;
        height: 32vmin;
        border: 1.5vmin solid #2f3a56;
        border-radius: 50%;
        background: #ffc94a;
        padding: 0;
        cursor: pointer;
        touch-action: manipulation;
      }
      #error-screen button svg {
        width: 60%;
        height: 60%;
      }
    </style>
  </head>
  <body>
    <div id="arcade"></div>
    <div id="error-screen" hidden>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="#9ad8f5" stroke="#2f3a56" stroke-width="5" />
        <circle cx="35" cy="42" r="6" fill="#2f3a56" />
        <circle cx="65" cy="42" r="6" fill="#2f3a56" />
        <ellipse cx="50" cy="68" rx="9" ry="7" fill="#2f3a56" />
      </svg>
      <button type="button" aria-label="Start again">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path
            d="M78 50a28 28 0 1 1-8.2-19.8"
            fill="none"
            stroke="#2f3a56"
            stroke-width="11"
            stroke-linecap="round"
          />
          <path d="M84 14v26H58z" fill="#2f3a56" />
        </svg>
      </button>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
