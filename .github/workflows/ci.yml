name: CI

# The same two commands an agent runs before pushing (docs/agents/ship-style.md).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers and their system libraries
        run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: npm run e2e
      - name: Keep the Playwright report when a browser test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
