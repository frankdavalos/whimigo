name: CI

# The same two commands an agent runs before pushing (docs/agents/ship-style.md). On `main`, the
# build they tested is then published to GitHub Pages (ADR-0013), and the published address is
# checked for this commit's build identifier.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time, and a run is never cancelled: a deployment in flight always finishes, and the
# check of the published address cannot be overtaken by the next push's deployment.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-e2e:
    runs-on: ubuntu-24.04
    # The browser tests draw a 2752 x 2064 canvas in software on two workers. The render-scale
    # test that presses every target of every screen at both scales takes about 6.5 minutes per
    # project, so the whole job takes about 35 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers and their system libraries
        run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: npm run e2e
      # The very dist/ that the browser tests ran against, so what is published is what passed.
      - name: Keep the tested build for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - name: Keep the Playwright report when a browser test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: check-and-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only this job may publish. It checks nothing out and runs no project code.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

  verify-deploy:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The published address serves this commit's build
        run: node scripts/verify-deploy.ts
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_BUILD_ID: ${{ github.sha }}
          VERIFY_ATTEMPTS: 20
          VERIFY_INTERVAL_SECONDS: 15
