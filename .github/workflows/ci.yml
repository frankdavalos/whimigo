name: CI

# The same two commands an agent runs before pushing (docs/agents/ship-style.md). On `main`, the
# build they tested is then published to GitHub Pages (ADR-0013), and the published address is
# checked for this commit's build identifier.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time, and a run is never cancelled: a deployment in flight always finishes, and the
# check of the published address cannot be overtaken by the next push's deployment.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # The browser tests draw a 2752 x 2064 canvas in software, so they run in jobs side by side, each
  # making its own production build and testing it. Each Chromium project's tests are shared among
  # four jobs (Playwright's --shard): in one job each, they took nearly 30 minutes once there were
  # three Games, and every Game adds to them. WebKit's smoke tests have a job of their own. Each
  # Chromium project's tests that open the Performance check run in one more job. Its standard load
  # needs the browser to draw steadily: a frame rate, 50 add-and-remove cycles in time, a short
  # press that stays short. Beside other browser tests those tests were starved of CPU, so they run
  # one at a time, in jobs of their own. They are each test with "performance-check" in its file
  # or title, and the render-scale test that presses every target of every screen.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ISOLATED: performance-check|every named target of every screen
    strategy:
      # Every job reports, whichever fails first.
      fail-fast: false
      matrix:
        include:
          - job: chromium-tablet-4x3-1-of-4
            browser: chromium
            args: --project=chromium-tablet-4x3 --grep-invert="$ISOLATED" --shard=1/4
          - job: chromium-tablet-4x3-2-of-4
            browser: chromium
            args: --project=chromium-tablet-4x3 --grep-invert="$ISOLATED" --shard=2/4
          - job: chromium-tablet-4x3-3-of-4
            browser: chromium
            args: --project=chromium-tablet-4x3 --grep-invert="$ISOLATED" --shard=3/4
          - job: chromium-tablet-4x3-4-of-4
            browser: chromium
            args: --project=chromium-tablet-4x3 --grep-invert="$ISOLATED" --shard=4/4
          - job: chromium-small-tablet-1-of-4
            browser: chromium
            args: --project=chromium-small-tablet --grep-invert="$ISOLATED" --shard=1/4
          - job: chromium-small-tablet-2-of-4
            browser: chromium
            args: --project=chromium-small-tablet --grep-invert="$ISOLATED" --shard=2/4
          - job: chromium-small-tablet-3-of-4
            browser: chromium
            args: --project=chromium-small-tablet --grep-invert="$ISOLATED" --shard=3/4
          - job: chromium-small-tablet-4-of-4
            browser: chromium
            args: --project=chromium-small-tablet --grep-invert="$ISOLATED" --shard=4/4
          - job: chromium-tablet-16x10-1-of-4
            browser: chromium
            args: --project=chromium-tablet-16x10 --grep-invert="$ISOLATED" --shard=1/4
          - job: chromium-tablet-16x10-2-of-4
            browser: chromium
            args: --project=chromium-tablet-16x10 --grep-invert="$ISOLATED" --shard=2/4
          - job: chromium-tablet-16x10-3-of-4
            browser: chromium
            args: --project=chromium-tablet-16x10 --grep-invert="$ISOLATED" --shard=3/4
          - job: chromium-tablet-16x10-4-of-4
            browser: chromium
            args: --project=chromium-tablet-16x10 --grep-invert="$ISOLATED" --shard=4/4
          - job: webkit-smoke
            browser: webkit
            args: --project=webkit-smoke
          - job: one-at-a-time-chromium-tablet-4x3
            browser: chromium
            args: --project=chromium-tablet-4x3 --workers=1 --grep="$ISOLATED"
          - job: one-at-a-time-chromium-small-tablet
            browser: chromium
            args: --project=chromium-small-tablet --workers=1 --grep="$ISOLATED"
          - job: one-at-a-time-chromium-tablet-16x10
            browser: chromium
            args: --project=chromium-tablet-16x10 --workers=1 --grep="$ISOLATED"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the project's browser and its system libraries
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run e2e -- ${{ matrix.args }}
      # Each job tested its own build. `same-build` checks they are byte for byte the same build, so
      # the one published is the one every job tested.
      - name: List the tested build's files and their checksums
        run: cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../build-checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: build-checksums-${{ matrix.job }}
          path: build-checksums.txt
          retention-days: 1
      - name: Keep the tested build for GitHub Pages
        if: github.ref == 'refs/heads/main' && matrix.job == 'chromium-tablet-4x3-1-of-4'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - name: Keep the Playwright report when a browser test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.job }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  same-build:
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-checksums-*
          path: checksums
      - name: Every browser-test job tested the same build
        run: |
          set -eu
          lists=$(find checksums -name build-checksums.txt | sort)
          count=$(printf '%s\n' "$lists" | wc -l)
          if [ "$count" -ne 16 ]; then
            echo "::error::expected a checksum list from each of the 16 browser-test jobs, found ${count}"
            exit 1
          fi
          first=$(printf '%s\n' "$lists" | head -n 1)
          for list in $lists; do
            diff -u "$first" "$list"
          done
          echo "all 16 browser-test jobs tested the same $(wc -l < "$first") files"

  deploy:
    needs: [check, e2e, same-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only this job may publish. It checks nothing out and runs no project code.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

  verify-deploy:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The published address serves this commit's build
        run: node scripts/verify-deploy.ts
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_BUILD_ID: ${{ github.sha }}
          VERIFY_ATTEMPTS: 20
          VERIFY_INTERVAL_SECONDS: 15
